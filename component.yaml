platform: Common
buildPlatform:
displayName: SonarQube Scanner
description: "Runs SonarQube Scanner CLI."
inputs:
- key: "AC_SONAR_VERSION"
  defaultValue: "8.2.0.6438"
  isRequired: true
  title: SonarQube Scanner Version
  description: "Specifies Scanner CLI version to be used. Enter latest to use the newest version published at the download location."
  helpText:
- key: "AC_SONAR_SCANNER_BASE_URL"
  defaultValue: "https://repo1.maven.org/maven2/org/sonarsource/scanner/cli/sonar-scanner-cli"
  isRequired: false
  title: Scanner Download Base URL
  description: "Base URL to download SonarScanner CLI from, in the Maven repository layout. Point it to your artifact proxy in air-gapped environments, for example https://nexus.example.com/repository/maven-public/org/sonarsource/scanner/cli/sonar-scanner-cli."
  helpText:
- key: "AC_SONAR_PARAMETERS"
  isRequired: false
  title: Scanner Parameters
  description: "Scanner parameters written in Java properties format."
  defaultValue: |
      sonar.sources=.
      sonar.organization=YOUR_ORGANIZATION
      sonar.login=YOUR_TOKEN
      sonar.projectKey=PROJECT_NAME
      sonar.host.url=https://sonar.example.test
  editorType: textarea
  helpText:
- key: "AC_SONAR_EXTRA_PARAMETERS"
  isRequired: false
  title: Scanner Commandline Parameters
  description: "Extra command line parameters. Enter -X for debug mode."
  helpText:  
outputs:
processFilename: ruby
processArguments: '%AC_STEP_TEMP%/main.rb'
files:
- "main.rb"